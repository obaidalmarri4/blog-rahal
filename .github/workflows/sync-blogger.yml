# مزامنة آلية: يسحب ما نُشر حديثاً في rahal-k.blogspot.com إلى src/content/posts
# ويرفعه إلى هذا الفرع، فيبنيه Vercel وينشره.
#
# التدوينات المستوردة آلياً تدخل بلا تصنيف: تظهر في دفتر الرحلات والرئيسية والألبوم
# وصفحتها الخاصة، ولا تظهر في صفحات القارات والدول حتى يُضاف مفتاحها يدوياً إلى
# src/data/taxonomy.json.
name: مزامنة Blogger

on:
  schedule:
    - cron: '17 */3 * * *' # كل 3 ساعات (بتوقيت UTC)
  workflow_dispatch: # زر «Run workflow» للتشغيل اليدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: sync-blogger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: سحب التدوينات الجديدة
        id: sync
        run: |
          SYNC_TITLES_FILE="$RUNNER_TEMP/sync-titles.txt" \
            node scripts/sync-blogger.mjs --abort-over 25

      # لا نرفع إلى الإنتاج شيئاً يكسر البناء
      - name: بناء الموقع للتأكد قبل النشر
        if: steps.sync.outputs.imported != '0'
        run: |
          npm ci
          npm run build

      - name: حفظ التدوينات ورفعها
        if: steps.sync.outputs.imported != '0'
        env:
          IMPORTED: ${{ steps.sync.outputs.imported }}
        run: |
          {
            echo "مزامنة آلية: استيراد ${IMPORTED} تدوينة من Blogger"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/sync-titles.txt"
            echo
            echo "بلا تصنيف بعد: تظهر في دفتر الرحلات وصفحتها، وتدخل صفحات القارات"
            echo "والدول عند إضافة مفاتيحها إلى src/data/taxonomy.json."
          } > "$RUNNER_TEMP/commit-message.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ما نجح سحبه رُفع أعلاه؛ الفاشل يُعاد في التشغيل التالي، وفشل المهمة هنا للتنبيه فقط
      - name: تنبيه عند تعذّر سحب بعض التدوينات
        if: steps.sync.outputs.failed != '0'
        run: |
          echo "::error::تعذّر سحب ${{ steps.sync.outputs.failed }} تدوينة — راجع سجل خطوة السحب."
          exit 1
